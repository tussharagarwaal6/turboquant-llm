# Per-model TabbyAPI overrides (copied into the model folder on launch).
# Tuned for single 16 GB GPU: ~24 GB EXL3 weights + Q8 KV cache.
model:
  backend: exllamav3
  max_seq_len: 16384
  cache_size: 16384
  cache_mode: Q8
  gpu_split_auto: true
  autosplit_reserve: [512]
  max_batch_size: 1
  chunk_size: 2048
  output_chunking: true
  tool_format: qwen3_coder
  cpu_moe_split_experts: 128

draft_model:
  draft_mode: mtp
  draft_cache_mode: Q8
