# TabbyAPI server config for KAT-Coder EXL3 (generated path via serve_kat.sh).
network:
  host: 0.0.0.0
  port: 8000
  disable_auth: true

logging:
  log_prompt: false
  log_generation_params: false

model:
  model_dir: MODEL_DIR_PLACEHOLDER
  model_name: KAT-Coder-V2.5-Dev-MTP-exl3-5bpw-hq
  backend: exllamav3
  inline_model_loading: true
  max_seq_len: 16384
  cache_size: 16384
  cache_mode: Q8
  gpu_split_auto: true
  autosplit_reserve: [512]
  max_batch_size: 1
  chunk_size: 2048
  output_chunking: true
  tool_format: qwen3_coder
  template_vars_default:
    enable_thinking: false

draft_model:
  draft_mode: mtp
  draft_cache_mode: Q8

memory:
  cuda_malloc_async: true
  sysmem_kv_cache: SYSMEM_KV_PLACEHOLDER

sampling:
  override_preset: safe_defaults
